# argo-cluster-debug eval fixtures — TEMPORARY, torn down after the run.
# Every object carries argo-skills-eval-fixture=true so teardown is unambiguous.
#
# Covers evals 1, 2, 4, 5, 6, 8 and 9 — every scenario whose named resources did not
# otherwise exist, which previously capped both arms at `partial`.
#
# Namespaces `production` and `prod` are created here because that is what the eval
# prompts name. teardown.sh will only delete a namespace that carries the fixture
# label, and setup.sh refuses to adopt one that already exists without it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: finance
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-staging
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-production
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
# EVAL 1 — "Application podinfo in the apps namespace is OutOfSync and Degraded"
# Syncs clean first; a post-sync live image patch then produces BOTH symptoms at once
# (live drift = OutOfSync, unpullable image = Degraded). selfHeal is off so it persists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: openshift-gitops
  labels:
    argo-skills-eval-fixture: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: kustomize-guestbook
    kustomize:
      images:
        - gcr.io/google-samples/gb-frontend=registry.access.redhat.com/ubi8/httpd-24:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
---
# EVAL 8 — "Application billing-service in namespace finance shows as Suspended"
# A blue-green Rollout; pausing it post-sync makes Argo CD report health=Suspended,
# which is intentional behaviour the skill must recognise rather than call a fault.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-service
  namespace: openshift-gitops
  labels:
    argo-skills-eval-fixture: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: blue-green
    helm:
      parameters:
        - name: image.repository
          value: registry.access.redhat.com/ubi8/httpd-24
        - name: image.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: finance
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
---
# EVAL 9 — "Application platform-ui uses multiple sources, one is the problem"
# Source[0] is a Helm chart; source[1] is a SEPARATE values repo. The chart's valueFiles
# points through $values at a path that does not exist in the values repo.
#
# The two sources deliberately use DIFFERENT repositories. An earlier version pointed
# both at the same repo, which made "which source is the problem" genuinely unanswerable
# — and the expectation that asked for it penalised answers that said so. With distinct
# repos the faulty one can be named without ambiguity.
#
# VERIFIED on OpenShift GitOps 1.21.3. Observed condition:
#   ComparisonError: failed to generate manifest for source 1 of 2 ... helm template ...
#   --values <cached>/envs/production/values.yaml ... Error: open ...: no such file
# i.e. the error names source 1 (argocd-example-apps, the chart being rendered) while the
# missing file lives in source 2's checkout (podinfo). Exactly the gap this tests.
#
# Note the gap this is designed to expose: Argo CD blames "source 1 of 2" because that is
# the source being rendered, while the missing file actually lives in source 2's
# checkout. A good answer distinguishes the two; a shallow one just echoes the error.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ui
  namespace: openshift-gitops
  labels:
    argo-skills-eval-fixture: "true"
spec:
  project: default
  sources:
    - repoURL: https://github.com/argoproj/argocd-example-apps.git
      targetRevision: HEAD
      path: helm-guestbook
      helm:
        valueFiles:
          - $values/envs/production/values.yaml
    # Separate values repo — a different repository from the chart source above.
    # It has no envs/ directory, so the chart's valueFiles path cannot resolve.
    - repoURL: https://github.com/stefanprodan/podinfo.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy: {}
---
# EVAL 5 — "ApplicationSet uses RollingSync across staging and production; staging
#           updated but production apps haven't started syncing"
# staging is given an unpullable image so it never reaches Healthy, which is precisely
# what blocks the RollingSync from advancing to the production step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eval-rollingsync
  namespace: openshift-gitops
  labels:
    argo-skills-eval-fixture: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        # maxUpdate is set deliberately. Eval 5 has an expectation asking whether
        # the staging step's maxUpdate requirement is satisfied; without the field
        # present that expectation was unsatisfiable and capped BOTH arms. Fix the
        # fixture, not the expectation.
        - maxUpdate: 1
          matchExpressions:
            - key: envLabel
              operator: In
              values: ["staging"]
        - maxUpdate: 1
          matchExpressions:
            - key: envLabel
              operator: In
              values: ["production"]
  generators:
    - list:
        elements:
          - env: staging
            ns: eval-staging
            image: registry.access.redhat.com/ubi8/does-not-exist-eval
          - env: production
            ns: eval-production
            image: registry.access.redhat.com/ubi8/httpd-24
  template:
    metadata:
      name: 'eval-{{.env}}'
      labels:
        argo-skills-eval-fixture: "true"
        envLabel: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: kustomize-guestbook
        kustomize:
          images:
            - 'gcr.io/google-samples/gb-frontend={{.image}}:latest'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.ns}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    argo-skills-eval-fixture: "true"
    pod-security.kubernetes.io/enforce: baseline
---
# EVAL 2 — "The canary rollout for frontend in production is stuck at step 2"
#
# steps[0] setWeight:20, steps[1] analysis. The user's "step 2" is steps[1] — the
# 0-based index is itself part of what the eval tests, so the fixture makes the
# off-by-one real rather than hypothetical.
#
# The analysis runs a Job that sleeps, so the AnalysisRun sits in Running with a
# live measurement and never resolves. That is what holds the Rollout at step 2:
# a genuine analysis-driven pause, distinguishable from a manual `spec.paused`.
# A failing job would abort the rollout instead of parking it, which is not the
# scenario the prompt describes.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: frontend-error-rate
  namespace: production
  labels:
    argo-skills-eval-fixture: "true"
spec:
  metrics:
    - name: error-rate
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  argo-skills-eval-fixture: "true"
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                    command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: production
  labels:
    argo-skills-eval-fixture: "true"
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: frontend
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: production
  labels:
    argo-skills-eval-fixture: "true"
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        argo-skills-eval-fixture: "true"
    spec:
      containers:
        - name: frontend
          image: registry.access.redhat.com/ubi8/httpd-24:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  strategy:
    canary:
      # No trafficRouting on purpose: without a mesh or ingress controller wired
      # in, canary weight is approximated by replica count. Eval 2 asks the agent
      # to check for traffic routing "if configured" — reporting its absence and
      # what that implies is the correct answer here, and the expectation was
      # reworded to accept exactly that rather than demanding a config that does
      # not exist.
      canaryService: frontend
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: frontend-error-rate
---
# EVAL 6 — "blue-green rollout for checkout-api in prod, sitting at preview for an
#           hour, autoPromotionEnabled is false, team expected it to analyze"
#
# autoPromotionEnabled is set EXPLICITLY false (the prompt says so) and there is NO
# prePromotionAnalysis. That is the whole point: `false` means "wait for a human",
# not "run analysis". The prompt's expectation that analysis would happen is the
# user's misconception, and the fixture has to contain the absence for the agent to
# be able to point at it.
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-active
  namespace: prod
  labels:
    argo-skills-eval-fixture: "true"
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: checkout-api
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-preview
  namespace: prod
  labels:
    argo-skills-eval-fixture: "true"
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: checkout-api
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout-api
  namespace: prod
  labels:
    argo-skills-eval-fixture: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        argo-skills-eval-fixture: "true"
    spec:
      containers:
        - name: checkout-api
          image: registry.access.redhat.com/ubi8/httpd-24:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  strategy:
    blueGreen:
      activeService: checkout-api-active
      previewService: checkout-api-preview
      autoPromotionEnabled: false
---
# EVAL 4 — "ApplicationSet team-apps uses a git directory generator but isn't
#           creating Applications for the new service directories I added"
#
# The generator points at a path pattern that matches no directory in the repo, so
# the controller reports success while generating zero Applications — the exact
# silent-failure shape the eval is about. `status.conditions` says
# ErrorOccurred=False and the Applications simply never appear.
#
# NOTE ON NAMESPACE: the prompt originally said `argocd`. On OpenShift GitOps the
# applicationset controller runs without --applicationset-namespaces and therefore
# only reconciles its OWN namespace, so an ApplicationSet in `argocd` would sit
# inert and the eval would measure nothing. Changing that would mean editing the
# shared ArgoCD CR. The prompt was changed to openshift-gitops instead.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-apps
  namespace: openshift-gitops
  labels:
    argo-skills-eval-fixture: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        revision: HEAD
        directories:
          # argocd-example-apps has no `services/` directory at all, so this
          # matches nothing and the generator yields an empty element list.
          - path: services/*
  template:
    metadata:
      name: 'team-{{.path.basename}}'
      labels:
        argo-skills-eval-fixture: "true"
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: apps
      syncPolicy: {}
