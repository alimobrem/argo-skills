<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 404" fill="none">
  <defs>
    <linearGradient id="tbg6" x1="0" y1="0" x2="0" y2="404">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect width="820" height="404" rx="10" fill="url(#tbg6)"/>
  <!-- Title bar -->
  <rect width="820" height="36" rx="10" fill="#24283b"/>
  <rect y="26" width="820" height="10" fill="#24283b"/>
  <circle cx="20" cy="18" r="6" fill="#f7768e"/>
  <circle cx="40" cy="18" r="6" fill="#e0af68"/>
  <circle cx="60" cy="18" r="6" fill="#9ece6a"/>
  <text x="410" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#565f89" text-anchor="middle">argo-knowledge — generate a multi-source Application</text>

  <!-- Content -->
  <g transform="translate(24, 52)" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5">

    <text y="12" fill="#565f89">&gt;</text>
    <text x="16" y="12" fill="#c0caf5">Helm chart from an OCI registry, values from our config repo</text>

    <!-- Generated manifest -->
    <rect x="0" y="28" width="772" height="248" rx="6" fill="#1f2335" stroke="#2a2e42"/>

    <text x="12" y="48" fill="#7dcfff">apiVersion:</text><text x="110" y="48" fill="#9ece6a">argoproj.io/v1alpha1</text>
    <text x="12" y="66" fill="#7dcfff">kind:</text><text x="110" y="66" fill="#9ece6a">Application</text>
    <text x="12" y="84" fill="#7dcfff">spec:</text>
    <text x="28" y="102" fill="#7dcfff">sources:</text>
    <text x="300" y="102" fill="#565f89" font-size="11">← plural array, not spec.source</text>

    <text x="44" y="120" fill="#c0caf5">- repoURL:</text>
    <text x="140" y="120" fill="#9ece6a">registry.example.com/charts</text>
    <text x="360" y="120" fill="#e0af68" font-size="11">← no oci:// scheme</text>
    <text x="58" y="138" fill="#7dcfff">chart:</text><text x="140" y="138" fill="#9ece6a">webapp</text>
    <text x="58" y="156" fill="#7dcfff">targetRevision:</text><text x="180" y="156" fill="#9ece6a">2.*</text>
    <text x="58" y="174" fill="#7dcfff">helm:</text>
    <text x="74" y="192" fill="#7dcfff">valueFiles:</text>
    <text x="90" y="210" fill="#9ece6a">- $values/envs/production/values.yaml</text>

    <text x="44" y="234" fill="#c0caf5">- repoURL:</text>
    <text x="140" y="234" fill="#9ece6a">https://github.com/org/config.git</text>
    <text x="58" y="252" fill="#7dcfff">ref:</text><text x="140" y="252" fill="#9ece6a">values</text>
    <text x="240" y="252" fill="#565f89" font-size="11">← defines $values above</text>

    <!-- Validation strip -->
    <rect x="0" y="292" width="772" height="26" rx="6" fill="#9ece6a" opacity="0.1" stroke="#9ece6a" stroke-opacity="0.35"/>
    <text x="12" y="309" fill="#9ece6a" font-weight="700">✓</text>
    <text x="30" y="309" fill="#c0caf5">Validated against the Argo CD CRD schema — real fields, correct nesting</text>

    <!-- Gotchas surfaced -->
    <text y="342" fill="#565f89" font-size="11" font-weight="700">ALSO FLAGGED</text>
    <text y="362" fill="#f7768e">•</text>
    <text x="16" y="362" fill="#c0caf5" font-size="11.5">oci:// in repoURL is the most common OCI mistake — fails like an auth error</text>
    <text y="380" fill="#f7768e">•</text>
    <text x="16" y="380" fill="#c0caf5" font-size="11.5">$values needs a ref: on the other source, or the chart silently renders defaults</text>
  </g>
</svg>
