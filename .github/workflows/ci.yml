name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | \
            tar xzf - -C /usr/local/bin
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o /usr/local/bin/yq && \
            chmod +x /usr/local/bin/yq
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz | \
            tar xzf - -C /usr/local/bin

      - name: Run discovery on test fixtures
        run: |
          for fixture in tests/argo-repo-audit/*/; do
            echo "=== $(basename $fixture) ==="
            bash skills/argo-repo-audit/scripts/discover.sh -d "$fixture"
            echo
          done

      - name: Run validation on test fixtures
        run: |
          for fixture in tests/argo-repo-audit/*/; do
            echo "=== $(basename $fixture) ==="
            # Intentionally-broken fixtures live under targeted-bugs/ and mixed-issues/;
            # those are expected to report findings. The clean fixtures must validate.
            case "$fixture" in
              */targeted-bugs/*|*/mixed-issues/*) bash skills/argo-repo-audit/scripts/validate.sh -d "$fixture" || true ;;
              *) bash skills/argo-repo-audit/scripts/validate.sh -d "$fixture" ;;
            esac
            echo
          done

      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './skills/argo-repo-audit/assets/schemas/*' | while read f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---' || { echo "Missing frontmatter: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Check skill registration
        run: bash scripts/check-skill-registration.sh

      - name: Validate eval expectations against CRD schemas
        run: bash scripts/check-eval-expectations.sh

      # Scores are only meaningful next to the expectation suite that produced
      # them. This fails if a result file was added without being recorded, so
      # history cannot silently drift out of date.
      - name: Benchmark history is current
        run: python3 scripts/record-run.py --check

      # Scores live in four places (root README, benchmarks/README.md, each
      # benchmarks/<skill>.md, and the verdict JSON). They have drifted apart
      # after a re-run more than once; a stale benchmark still looks
      # authoritative, so this recomputes from the verdicts and compares.
      - name: Published numbers match the verdict files
        run: python3 scripts/check-published-numbers.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: a PR can add a secret in one commit and remove it in a
          # later one, and the secret is still in the history being merged.
          # The default fetch-depth of 1 would scan a single commit and pass.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xzf - -C /usr/local/bin gitleaks
          gitleaks version

      # Guard against the allowlist silently disabling every rule. Gitleaks v8
      # REPLACES its default ruleset when handed a config, so an allowlist-only
      # .gitleaks.toml leaves it with zero rules: every scan then passes and
      # reports nothing. `[extend] useDefault = true` prevents that, and this
      # step fails loudly if someone ever removes it.
      - name: Self-test — the config must still detect a planted secret
        run: |
          probe="$(mktemp -d)"
          # Generate the probe token at RUNTIME. Writing a literal secret-shaped
          # string into this file would itself trip secret scanners -- including
          # this repo's own pre-commit hook, which is how that was caught.
          body="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          printf 'token: ghp_%s\n' "$body" > "$probe/planted.yaml"
          cp .gitleaks.toml "$probe/"
          if gitleaks detect --source="$probe" --no-git --no-banner \
               --config="$probe/.gitleaks.toml" --redact >/dev/null 2>&1; then
            echo "::error::.gitleaks.toml did NOT detect a planted secret — the ruleset is disabled."
            echo "Check that [extend] useDefault = true is still present."
            exit 1
          fi
          echo "OK: the config detects a planted secret, so rules are active."

          # Second guard: the allowlist must behave the same when the scan root
          # is NOT the repo root. CI scans from the repo root, where paths are
          # relative, so an allowlist path anchored with ^ matches here and
          # silently fails in the pre-commit hook, which scans a temp directory
          # of the staged index. That asymmetry is invisible to a repo-root-only
          # check -- it shipped once already.
          nested="$probe/nested"
          mkdir -p "$nested/tests/argo-repo-audit/guard"
          cp .gitleaks.toml "$nested/"
          printf 'token: ghp_%s\n' "$body" > "$nested/tests/argo-repo-audit/guard/f.yaml"
          if ! gitleaks detect --source="$nested" --no-git --no-banner \
                 --config="$nested/.gitleaks.toml" --redact >/dev/null 2>&1; then
            echo "::error::Allowlist did not apply when scanning from a non-repo-root path."
            echo "A path entry is probably anchored with ^ -- gitleaks matches the"
            echo "absolute path there. Remove the anchor (see .gitleaks.toml)."
            exit 1
          fi
          echo "OK: allowlist applies from a non-repo-root scan path too."

      - name: Scan repository and full history
        run: |
          gitleaks detect --source=. --no-banner --config=.gitleaks.toml \
            --redact --report-format=json --report-path=gitleaks-report.json

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
